<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 570" width="420" height="570">
  <defs>
    <!-- Modal Blue Gradient -->
    <linearGradient id="modalBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00a2f5" />
      <stop offset="50%" stop-color="#0088d8" />
      <stop offset="100%" stop-color="#0077c4" />
    </linearGradient>

    <!-- Card Dark Blue Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#004d8c" />
      <stop offset="100%" stop-color="#003666" />
    </linearGradient>

    <!-- Header & Button Start (Blue) -->
    <linearGradient id="btnBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00b4ff" />
      <stop offset="100%" stop-color="#0077c4" />
    </linearGradient>

    <!-- Button Stop (Red) -->
    <linearGradient id="btnRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4757" />
      <stop offset="100%" stop-color="#c0392b" />
    </linearGradient>

    <!-- Progress Bar Gradient -->
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#ffe853" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="hudBorderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff">
        <animate attributeName="stop-color" values="#00e5ff;#7fe3ff;#0099ff;#00e5ff" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7fe3ff">
        <animate attributeName="stop-color" values="#7fe3ff;#00e5ff;#7fe3ff;#0077c4" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0077c4">
        <animate attributeName="stop-color" values="#0077c4;#00e5ff;#7fe3ff;#0077c4" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Modal Shadow Filter -->
    <filter id="hudShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#00143c" flood-opacity="0.65" />
    </filter>
  </defs>

  <style>
    @keyframes pulseHudBorder {
      0%, 100% { stroke-opacity: 0.85; stroke-width: 3.5px; }
      50% { stroke-opacity: 1; stroke-width: 5px; }
    }
    @keyframes cursorMovement {
      0% { transform: translate(370px, 545px); opacity: 0; }
      4% { opacity: 1; }
      10% { transform: translate(210px, 495px); }
      11% { transform: translate(210px, 495px) scale(0.88); }
      12% { transform: translate(210px, 495px) scale(1); }
      18% { transform: translate(310px, 535px); opacity: 0.85; }
      60% { transform: translate(310px, 535px); opacity: 0.85; }
      68% { transform: translate(210px, 495px); opacity: 1; }
      71% { transform: translate(210px, 495px); }
      72% { transform: translate(210px, 495px) scale(0.88); }
      73% { transform: translate(210px, 495px) scale(1); }
      82% { transform: translate(380px, 555px); opacity: 1; }
      87%, 100% { transform: translate(380px, 555px); opacity: 0; }
    }
    @keyframes startBtnVisibility {
      0%, 11.9% { opacity: 1; }
      12%, 72.9% { opacity: 0; }
      73%, 100% { opacity: 1; }
    }
    @keyframes stopBtnVisibility {
      0%, 11.9% { opacity: 0; }
      12%, 72.9% { opacity: 1; }
      73%, 100% { opacity: 0; }
    }
    @keyframes statusActiveVisibility {
      0%, 11.9% { opacity: 0; }
      12%, 72.9% { opacity: 1; }
      73%, 100% { opacity: 0; }
    }
    @keyframes statusPausedVisibility {
      0%, 11.9% { opacity: 1; }
      12%, 72.9% { opacity: 0; }
      73%, 100% { opacity: 1; }
    }
    .hud-frame-glow { animation: pulseHudBorder 3s ease-in-out infinite; }
    .mouse-cursor { animation: cursorMovement 10s ease-in-out infinite; pointer-events: none; }
    .btn-start-state { animation: startBtnVisibility 10s step-end infinite; }
    .btn-stop-state { animation: stopBtnVisibility 10s step-end infinite; }
    .status-active-state { animation: statusActiveVisibility 10s step-end infinite; }
    .status-paused-state { animation: statusPausedVisibility 10s step-end infinite; }
  </style>

  <!-- Outer Modal Container with CP Blue Frame and Animated Cyan Borders -->
  <rect x="15" y="15" width="390" height="540" rx="20" ry="20" fill="url(#modalBg)" stroke="#00305a" stroke-width="4" filter="url(#hudShadow)" />
  <rect class="hud-frame-glow" x="15" y="15" width="390" height="540" rx="20" ry="20" fill="none" stroke="url(#hudBorderGlow)" stroke-width="3.5" />
  <rect x="19" y="19" width="382" height="532" rx="16" ry="16" fill="none" stroke="#66f3ff" stroke-width="1.5" opacity="0.6" />

  <!-- Modal Header -->
  <g transform="translate(30, 32)">
    <!-- Igloo Vector Icon -->
    <g transform="translate(0, 4) scale(0.2)">
      <path d="M 5 50 A 45 45 0 0 1 95 50 Z" fill="#ffffff" />
      <path d="M 35 50 A 15 15 0 0 1 65 50 Z" fill="#003b70" />
    </g>
    <text x="32" y="24" font-family="'Fredoka', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="20" fill="#ffffff" stroke="#00305a" stroke-width="2.5" paint-order="stroke fill" letter-spacing="1">
      IGLOOLIKER 3000
    </text>

    <!-- Minimize and Close Buttons -->
    <circle cx="310" cy="18" r="14" fill="url(#btnBlue)" stroke="#00e5ff" stroke-width="2" />
    <text x="310" y="23" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="16" fill="#ffffff">-</text>

    <circle cx="345" cy="18" r="14" fill="url(#btnBlue)" stroke="#00e5ff" stroke-width="2" />
    <text x="345" y="23" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="14" fill="#ffffff">x</text>

    <!-- Header Divider -->
    <line x1="0" y1="42" x2="360" y2="42" stroke="#00e5ff" stroke-width="2" opacity="0.35" />
  </g>

  <!-- Status Bar Pill (Animated between Paused and Active) -->
  <g transform="translate(35, 92)">
    <rect x="0" y="0" width="350" height="34" rx="17" ry="17" fill="#003b70" stroke="#00e5ff" stroke-width="2" />

    <!-- Paused State -->
    <g class="status-paused-state">
      <circle cx="20" cy="17" r="5" fill="#ffcc00" stroke="#ffffff" stroke-width="1.5" />
      <text x="35" y="22" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="12" fill="#ffffff">
        Status: Ready (Paused)
      </text>
    </g>

    <!-- Active State -->
    <g class="status-active-state">
      <circle cx="20" cy="17" r="5" fill="#2ed573" stroke="#ffffff" stroke-width="1.5" />
      <text x="35" y="22" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="12" fill="#ffffff">
        Status: Active &amp; Dancing
      </text>
    </g>

    <text x="330" y="22" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="12" fill="#8edeff">
      All Rooms
    </text>
  </g>

  <!-- Likes & Goal Card -->
  <g transform="translate(35, 138)">
    <rect x="0" y="0" width="350" height="142" rx="16" ry="16" fill="url(#cardBg)" stroke="#00e5ff" stroke-width="2.5" />

    <!-- Card Header: Title & Progress % -->
    <text x="16" y="26" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" fill="#ffffff">
      PROGRESSION GOAL
    </text>
    <rect x="250" y="10" width="85" height="24" rx="12" ry="12" fill="#002b4d" stroke="#00e5ff" stroke-width="1.5" />
    <text x="292" y="26" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="12" fill="#00ffff">
      12.00%
    </text>

    <!-- Likes Box -->
    <g transform="translate(30, 44)">
      <text x="50" y="14" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="11" fill="#8edeff">
        LIKES
      </text>
      <rect x="0" y="20" width="100" height="34" rx="17" ry="17" fill="#002d55" stroke="#50d0ff" stroke-width="2" />
      <text x="50" y="43" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="16" fill="#ffea79">
        120
      </text>
    </g>

    <!-- Slash Separator -->
    <text x="175" y="94" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="22" fill="#00e5ff" opacity="0.6">/</text>

    <!-- Goal Box -->
    <g transform="translate(220, 44)">
      <text x="50" y="14" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="11" fill="#8edeff">
        GOAL
      </text>
      <rect x="0" y="20" width="100" height="34" rx="17" ry="17" fill="#002d55" stroke="#00e5ff" stroke-width="2" />
      <text x="50" y="43" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="16" fill="#ffffff">
        1000
      </text>
    </g>

    <!-- Progress Bar Track -->
    <rect x="16" y="112" width="318" height="14" rx="7" ry="7" fill="#002040" stroke="#00e5ff" stroke-width="1.5" />
    <rect x="18" y="114" width="70" height="10" rx="5" ry="5" fill="url(#progressGrad)" />
  </g>

  <!-- Checkbox Options -->
  <g transform="translate(45, 298)">
    <!-- Checkbox 1: Auto Dance -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="20" height="20" rx="6" ry="6" fill="#003b70" stroke="#00e5ff" stroke-width="2" />
      <path d="M 4 10 L 8 14 L 16 5" fill="none" stroke="#ffcc00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="32" y="15" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" fill="#ffffff">
        Auto-Dance ('D' Keypress)
      </text>
    </g>

    <!-- Checkbox 2: Rotate Phrases -->
    <g transform="translate(0, 32)">
      <rect x="0" y="0" width="20" height="20" rx="6" ry="6" fill="#003b70" stroke="#00e5ff" stroke-width="2" />
      <path d="M 4 10 L 8 14 L 16 5" fill="none" stroke="#ffcc00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="32" y="15" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" fill="#ffffff">
        Rotate 4 'One K' Like Phrases
      </text>
    </g>

    <!-- Checkbox 3: Anti-Spam Jitter -->
    <g transform="translate(0, 64)">
      <rect x="0" y="0" width="20" height="20" rx="6" ry="6" fill="#003b70" stroke="#00e5ff" stroke-width="2" />
      <path d="M 4 10 L 8 14 L 16 5" fill="none" stroke="#ffcc00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="32" y="15" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" fill="#ffffff">
        Random Anti-Spam (9s to 11s)
      </text>
    </g>
  </g>

  <!-- Next Message Preview Box -->
  <g transform="translate(35, 404)">
    <rect x="0" y="0" width="350" height="52" rx="12" ry="12" fill="#003b70" stroke="#00e5ff" stroke-width="1.5" />
    <text x="12" y="18" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="11" fill="#8edeff">
      CURRENT ROTATING MESSAGE:
    </text>
    <text x="12" y="38" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="11.5" fill="#ffffff">
      "Igloo liking party! Help me reach one k! Thanks..."
    </text>
  </g>

  <!-- ==================== ANIMATED BUTTON (START / STOP) ==================== -->
  <g transform="translate(35, 474)">
    <!-- START BOT State (Blue) -->
    <g class="btn-start-state">
      <rect x="0" y="0" width="350" height="52" rx="26" ry="26" fill="url(#btnBlue)" stroke="#00e5ff" stroke-width="3" />
      <rect x="4" y="4" width="342" height="20" rx="10" ry="10" fill="#ffffff" opacity="0.15" />
      <text x="175" y="33" text-anchor="middle" font-family="'Fredoka', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="18" fill="#ffffff" stroke="#00284d" stroke-width="2" paint-order="stroke fill" letter-spacing="2">
        START BOT
      </text>
    </g>

    <!-- STOP BOT State (Red) - Visible for 6 Seconds -->
    <g class="btn-stop-state">
      <rect x="0" y="0" width="350" height="52" rx="26" ry="26" fill="url(#btnRed)" stroke="#ff6b81" stroke-width="3" />
      <rect x="4" y="4" width="342" height="20" rx="10" ry="10" fill="#ffffff" opacity="0.15" />
      <text x="175" y="33" text-anchor="middle" font-family="'Fredoka', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="18" fill="#ffffff" stroke="#5c0000" stroke-width="2" paint-order="stroke fill" letter-spacing="2">
        STOP BOT
      </text>
    </g>
  </g>

  <!-- Footer Version and Author Credits -->
  <g transform="translate(210, 546)">
    <text text-anchor="middle" font-family="'Fredoka', 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#ffffff" letter-spacing="0.3">
      Version 3.2.0 Made by <tspan fill="#ffd700" text-decoration="underline">Caiovski</tspan>
    </text>
  </g>

  <!-- ==================== ANIMATED MOUSE CURSOR ==================== -->
  <g class="mouse-cursor">
    <path d="M 0 0 L 0 20 L 4.8 15.5 L 9 24 L 12.5 22.5 L 8.3 14.5 L 14.5 14.5 Z" fill="#ffffff" stroke="#001830" stroke-width="2" stroke-linejoin="round" />
  </g>
</svg>
