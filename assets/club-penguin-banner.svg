<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00b4ff" />
      <stop offset="45%" stop-color="#0088d8" />
      <stop offset="100%" stop-color="#004a80" />
    </linearGradient>

    <!-- Card Bevel Gradient -->
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#66f3ff" />
      <stop offset="100%" stop-color="#0088d8" />
    </linearGradient>

    <!-- Button / Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#003b70" />
      <stop offset="100%" stop-color="#002040" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe679" />
      <stop offset="100%" stop-color="#f5a623" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cpShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#00143c" flood-opacity="0.65" />
    </filter>

    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#002040" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Outer Frame Shadow & Background -->
  <rect x="15" y="15" width="870" height="250" rx="24" ry="24" fill="url(#bgGrad)" stroke="#00e5ff" stroke-width="4" filter="url(#cpShadow)" />
  <rect x="19" y="19" width="862" height="242" rx="20" ry="20" fill="none" stroke="#66f3ff" stroke-width="1.5" opacity="0.6" />

  <!-- Snow Caps on Top Border -->
  <path d="M 25 35 Q 60 48, 95 33 Q 130 50, 175 32 Q 220 52, 270 34 Q 330 54, 390 32 Q 450 50, 510 33 Q 570 52, 630 34 Q 700 50, 770 33 Q 830 52, 875 35" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.75" />

  <!-- Igloo Vector Silhouette Left -->
  <g transform="translate(45, 60)" opacity="0.35">
    <path d="M 10 90 A 60 60 0 0 1 110 90 Z" fill="#ffffff" />
    <path d="M 45 90 A 20 20 0 0 1 75 90 Z" fill="#003b70" />
    <line x1="10" y1="90" x2="110" y2="90" stroke="#ffffff" stroke-width="3" />
    <path d="M 25 70 Q 60 55, 95 70" fill="none" stroke="#003b70" stroke-width="2" />
    <path d="M 40 48 Q 60 42, 80 48" fill="none" stroke="#003b70" stroke-width="2" />
  </g>

  <!-- Snowflake Vector Right -->
  <g transform="translate(775, 60)" stroke="#ffffff" stroke-width="2.5" opacity="0.3" stroke-linecap="round">
    <line x1="45" y1="10" x2="45" y2="80" />
    <line x1="10" y1="45" x2="80" y2="45" />
    <line x1="20" y1="20" x2="70" y2="70" />
    <line x1="20" y1="70" x2="70" y2="20" />
    <circle cx="45" cy="45" r="5" fill="#ffffff" />
  </g>

  <!-- Title: IGLOOLIKER 3000 -->
  <text x="450" y="105" text-anchor="middle" font-family="'Fredoka', 'Balsamiq Sans', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="46" fill="#ffffff" stroke="#00284d" stroke-width="4" paint-order="stroke fill" filter="url(#textShadow)" letter-spacing="2">
    IGLOOLIKER 3000
  </text>

  <!-- Subtitle -->
  <text x="450" y="142" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="16" fill="#d4f4ff" letter-spacing="1">
    UNIVERSAL AFK IGLOO LIKES BOOSTER FOR CLUB PENGUIN JOURNEY
  </text>

  <!-- Divider Line -->
  <line x1="150" y1="162" x2="750" y2="162" stroke="#00e5ff" stroke-width="2" opacity="0.6" />

  <!-- Badge Cluster -->
  <!-- Badge 1: Version -->
  <g transform="translate(80, 185)">
    <rect x="0" y="0" width="160" height="38" rx="19" ry="19" fill="url(#badgeGrad)" stroke="#00e5ff" stroke-width="2" />
    <text x="80" y="24" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" fill="#ffffff">
      VERSION 3.0.0
    </text>
  </g>

  <!-- Badge 2: CPJ Yukon Safe -->
  <g transform="translate(260, 185)">
    <rect x="0" y="0" width="180" height="38" rx="19" ry="19" fill="url(#badgeGrad)" stroke="#00e5ff" stroke-width="2" />
    <circle cx="22" cy="19" r="6" fill="#00e5ff" />
    <text x="100" y="24" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" fill="#66f3ff">
      ZERO DISCONNECT
    </text>
  </g>

  <!-- Badge 3: Yukon DOM Injection -->
  <g transform="translate(460, 185)">
    <rect x="0" y="0" width="180" height="38" rx="19" ry="19" fill="url(#badgeGrad)" stroke="#00e5ff" stroke-width="2" />
    <circle cx="22" cy="19" r="6" fill="#2ed573" />
    <text x="100" y="24" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" fill="#ffffff">
      ALL ROOMS ACTIVE
    </text>
  </g>

  <!-- Badge 4: CAIOVSKI Author Watermark -->
  <g transform="translate(660, 185)">
    <rect x="0" y="0" width="160" height="38" rx="19" ry="19" fill="url(#badgeGrad)" stroke="#ffea79" stroke-width="2" />
    <text x="80" y="24" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="13" fill="#ffea79" letter-spacing="1">
      BY CAIOVSKI
    </text>
  </g>
</svg>
